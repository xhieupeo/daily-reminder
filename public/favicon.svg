<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Outer Dark Border -->
  <rect x="0" y="0" width="64" height="64" fill="#0d0c17" />
  
  <!-- Warm Sakura & Twilight Gradient Background -->
  <rect x="4" y="4" width="56" height="56" fill="#1e1c31" />
  <rect x="4" y="4" width="56" height="24" fill="#2d2948" />
  <rect x="4" y="4" width="56" height="12" fill="#98c9eb" opacity="0.3" />

  <!-- Cozy Little Window with Star / Moon -->
  <rect x="8" y="8" width="16" height="16" fill="#141324" stroke="#4a445f" stroke-width="2" />
  <rect x="14" y="11" width="4" height="4" fill="#f9c846" />
  <rect x="18" y="15" width="2" height="2" fill="#ffc1e3" />

  <!-- Desk Lamp (Yellow Pixel Glow) -->
  <rect x="44" y="14" width="10" height="6" fill="#f9c846" />
  <rect x="48" y="20" width="2" height="12" fill="#5c4033" />
  <rect x="46" y="32" width="6" height="3" fill="#3e2723" />
  <!-- Warm Light Cone -->
  <polygon points="40,20 58,20 60,46 34,46" fill="#f9c846" opacity="0.25" />

  <!-- Wooden Study Desk Surface -->
  <rect x="4" y="44" width="56" height="16" fill="#6d4c41" />
  <rect x="4" y="44" width="56" height="3" fill="#8d6e63" />
  <rect x="4" y="58" width="56" height="2" fill="#4e342e" />

  <!-- Open Study Book with Bookmark -->
  <rect x="18" y="40" width="14" height="9" fill="#f6eedb" />
  <rect x="32" y="40" width="14" height="9" fill="#ede0c8" />
  <rect x="31" y="39" width="2" height="11" fill="#ea7679" />
  <!-- Text lines in book -->
  <rect x="20" y="42" width="10" height="1" fill="#9e9e9e" />
  <rect x="20" y="44" width="10" height="1" fill="#9e9e9e" />
  <rect x="20" y="46" width="7" height="1" fill="#9e9e9e" />
  <rect x="34" y="42" width="10" height="1" fill="#9e9e9e" />
  <rect x="34" y="44" width="10" height="1" fill="#9e9e9e" />
  <rect x="34" y="46" width="6" height="1" fill="#9e9e9e" />

  <!-- Steaming Matcha Cup -->
  <rect x="10" y="42" width="6" height="6" fill="#f6eedb" />
  <rect x="11" y="43" width="4" height="4" fill="#8bd5ca" />
  <!-- Steam curls -->
  <rect x="11" y="38" width="1" height="2" fill="#e0f2f1" opacity="0.8" />
  <rect x="13" y="36" width="1" height="2" fill="#e0f2f1" opacity="0.8" />

  <!-- Floating Sakura Blossom Petals -->
  <!-- Petal 1 -->
  <rect x="38" y="24" width="3" height="3" fill="#f48fb1" />
  <rect x="39" y="23" width="1" height="1" fill="#ffc1e3" />
  <!-- Petal 2 -->
  <rect x="26" y="18" width="3" height="2" fill="#f48fb1" />
  <!-- Petal 3 -->
  <rect x="14" y="28" width="2" height="3" fill="#ff80ab" />
  <!-- Petal 4 resting on desk -->
  <rect x="46" y="42" width="3" height="2" fill="#f48fb1" />

  <!-- Cute Pixel Cat Peeking Behind Desk -->
  <rect x="24" y="30" width="2" height="3" fill="#f48fb1" />
  <rect x="34" y="30" width="2" height="3" fill="#f48fb1" />
  <rect x="25" y="32" width="10" height="8" fill="#f6eedb" />
  <rect x="27" y="34" width="2" height="2" fill="#0d0c17" />
  <rect x="31" y="34" width="2" height="2" fill="#0d0c17" />
  <rect x="29" y="36" width="2" height="1" fill="#ea7679" />
</svg>

